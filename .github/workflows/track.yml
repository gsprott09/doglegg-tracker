name: Track bay bookings

# GitHub sometimes starts scheduled runs hours late, so each run stays open for
# ~5h30m and checks every 30 minutes itself. Runs are allowed to overlap so a late
# start never leaves a gap; scrape.py skips any half-hour another run already recorded.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright==1.52.0
          python -m playwright install --with-deps chromium

      - name: Check every 30 minutes
        run: |
          git config user.name "booking-tracker"
          git config user.email "booking-tracker@users.noreply.github.com"
          stop=$(( $(date +%s) + 5*3600 + 30*60 ))
          # spread overlapping runs a little so they don't all check at the same second
          offset=$(( 60 + RANDOM % 240 ))
          while true; do
            git pull --rebase -q || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; }
            python scrape.py || echo "check failed; will try again next time"
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "Booking check $(TZ=America/Chicago date '+%Y-%m-%d %H:%M')"
              for i in 1 2 3; do
                git pull --rebase -q && git push -q && break
                # another run saved the same half-hour first: keep theirs, drop ours
                git rebase --abort 2>/dev/null; git reset -q --hard origin/main; break
              done
            fi
            now=$(date +%s)
            next=$(( now - now % 1800 + 1800 + offset ))
            if [ "$next" -ge "$stop" ]; then break; fi
            sleep $(( next - now ))
          done
